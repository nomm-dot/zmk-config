CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

## Allow the dongle screen from turning off when idle (30 seconds)
## reduces burn-in, power consumption, and increases backlight lifespan
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y
# Set keyboard idle state to 5 minutes (300,000 ms)
CONFIG_ZMK_IDLE_TIMEOUT=300000

## Disable ambient light sensor and set fixed brightness
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=60

# Enable Words Per Minute calculation
# build fails without this
CONFIG_ZMK_WPM=y

#CONFIG_PROSPECTOR_MODIFIER_ORDER="GACS"

