CONFIG_ZMK_SPLIT_BLE_CENTRAL_PERIPHERALS=2

CONFIG_ZMK_SLEEP=n

CONFIG_PROSPECTOR_STATUS_SCREEN_OPERATOR=y

## Allow the dongle screen from turning off when idle (30 seconds)
## reduces burn-in, power consumption, and increases backlight lifespan
CONFIG_ZMK_DISPLAY_BLANK_ON_IDLE=y

## Disable ambient light sensor and set fixed brightness
CONFIG_PROSPECTOR_USE_AMBIENT_LIGHT_SENSOR=n
CONFIG_PROSPECTOR_FIXED_BRIGHTNESS=60

